name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: DRY_RUN=1 bash install.sh

      - run: npm run dry-run:install

      - run: npm run dry-run:uninstall

      - run: node bin/cccn.js doctor --claude-dir "$RUNNER_TEMP/claude"
